name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild at 11:03 UTC = 5:03am US Central Standard Time (6:03am during daylight saving).
    # GitHub cron is UTC-only and can start a few minutes late.
    - cron: '3 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh tables and fixtures from BBC Sport (leaves data untouched if parsing fails)
        run: node scripts/update-data.mjs || true
      - name: Refresh news snapshot (offline fallback; live feeds load in the browser)
        run: node scripts/update-news.mjs || true
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html app.js styles.css sw.js manifest.webmanifest icons data _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
